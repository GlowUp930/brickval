name: Reliability checks
on:
  pull_request:
    paths: ['src/**', 'supabase/**', 'tests/**', 'scripts/**', 'apps/ios-swift/**', 'package*.json', '.github/workflows/reliability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:localization
      - run: npm audit --omit=dev --audit-level=moderate
  native-and-database:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install postgresql@17 xcodegen
      - run: BRICKVAL_AUDIT_PG_BIN="$(brew --prefix postgresql@17)/bin" python3 scripts/test-reliability-database.py
      - run: xcodegen generate
        working-directory: apps/ios-swift
      - name: Native tests on a small iPhone
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"] in ["iPhone 16e", "iPhone SE (3rd generation)"]))')
          xcodebuild -project apps/ios-swift/BrickVal.xcodeproj -scheme BrickVal -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
