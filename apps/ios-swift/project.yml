name: BrickVal
options:
  bundleIdPrefix: com.brickval
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.3.2
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: 5.80.3
  Superwall:
    url: https://github.com/superwall/Superwall-iOS
    exactVersion: 4.16.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.21.0
settings:
  base:
    DEVELOPMENT_TEAM: 4CQHLZBSU7
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  BrickVal:
    type: application
    platform: iOS
    sources:
      - path: BrickVal
        excludes:
          - Resources/Info.plist
          - Resources/BrickVal.entitlements
          - Resources/PrivacyInfo.xcprivacy
    resources:
      - path: BrickVal/Resources
        excludes:
          - Info.plist
          - BrickVal.entitlements
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    preBuildScripts:
      - name: Verify Release Configuration
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then
            exit 0
          fi

          if [ -z "${REVENUECAT_API_KEY:-}" ]; then
            echo "error: REVENUECAT_API_KEY is required for Release builds."
            exit 1
          fi

          if [ -z "${SUPERWALL_API_KEY:-}" ]; then
            echo "error: SUPERWALL_API_KEY is required for Release builds."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brickval.app
        PRODUCT_NAME: BrickVal
        INFOPLIST_FILE: BrickVal/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrickVal/Resources/BrickVal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: 1.0.5
        CURRENT_PROJECT_VERSION: 142
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: HO LAM CHAN (4CQHLZBSU7)"
          PROVISIONING_PROFILE_SPECIFIER: BrickVal App Store Build 125
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: RevenueCat
        product: RevenueCat
      - package: Superwall
        product: SuperwallKit
      - package: Sentry
        product: Sentry-Dynamic
  BrickValTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BrickValTests
    dependencies:
      - target: BrickVal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brickval.app.tests
        GENERATE_INFOPLIST_FILE: YES
  BrickValUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BrickValUITests
    dependencies:
      - target: BrickVal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brickval.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BrickVal:
    build:
      targets:
        BrickVal: all
        BrickValTests: [test]
        BrickValUITests: [test]
    test:
      targets:
        - BrickValTests
        - BrickValUITests
      gatherCoverageData: true
