<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrickVal Tab Bar Preview</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.88);
      --muted: #6e6e73;
      --text: #111111;
      --line: #e5e5ea;
      --yellow: #f2cd37;
      --yellow-pressed: #d9b52f;
      --shadow: 0 18px 50px rgba(17, 17, 17, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 255, 255, 0.92), transparent 34%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--text);
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 46px;
      background: var(--bg);
      border: 10px solid #111111;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      position: relative;
    }

    .screen {
      height: 100%;
      padding: 58px 20px 104px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .kicker {
      margin: 0 0 5px;
      color: var(--yellow-pressed);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
    }

    .pill {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }

    .card {
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 18px;
      backdrop-filter: blur(18px);
    }

    .hero-card {
      min-height: 330px;
      display: grid;
      align-content: center;
      gap: 20px;
    }

    .value {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .line {
      height: 118px;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(242, 205, 55, 0.14), rgba(242, 205, 55, 0)),
        linear-gradient(135deg, transparent 22%, rgba(242, 205, 55, 0.55) 23%, rgba(242, 205, 55, 0.55) 24%, transparent 25%),
        #ffffff;
      border: 1px solid var(--line);
    }

    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      padding: 10px 28px 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.78);
      border-top: 1px solid rgba(209, 209, 214, 0.72);
      backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 -12px 30px rgba(17, 17, 17, 0.07);
    }

    .tab {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .tab img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      opacity: 0.46;
      filter: grayscale(1);
    }

    .tab.active {
      color: var(--text);
    }

    .tab.active .icon-shell {
      background: var(--yellow);
      border-color: var(--yellow);
      box-shadow: 0 8px 18px rgba(217, 181, 47, 0.22);
    }

    .tab.active img {
      opacity: 1;
      filter: none;
    }

    .icon-shell {
      width: 40px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid transparent;
      display: grid;
      place-items: center;
      transition: 160ms ease;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="BrickVal tab bar preview">
    <section class="screen">
      <div class="top">
        <div>
          <p class="kicker">Collection</p>
          <h1>Your LEGO value</h1>
        </div>
        <div class="pill">Scan</div>
      </div>
      <div class="card hero-card">
        <div>
          <p class="kicker">Device value</p>
          <div class="value">$2,140</div>
        </div>
        <div class="line" aria-hidden="true"></div>
      </div>
    </section>

    <nav class="tabbar" aria-label="Bottom tabs">
      <div class="tab active">
        <span class="icon-shell">
          <img src="file:///Users/holamchan/Downloads/collection.png" alt="" />
        </span>
        <span>Collection</span>
      </div>
      <div class="tab">
        <span class="icon-shell">
          <img src="file:///Users/holamchan/Downloads/scanning.png" alt="" />
        </span>
        <span>Scan</span>
      </div>
      <div class="tab">
        <span class="icon-shell">
          <img src="file:///Users/holamchan/Downloads/gear.png" alt="" />
        </span>
        <span>Settings</span>
      </div>
    </nav>
  </main>
</body>
</html>
