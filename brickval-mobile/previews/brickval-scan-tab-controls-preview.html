<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrickVal Scan Controls Preview</title>
  <style>
    :root {
      --yellow: #F2CD37;
      --text: #111111;
      --muted: #6E6E73;
      --surface: rgba(255,255,255,.82);
      --stroke: rgba(17,17,17,.12);
      --dark-glass: rgba(16,16,18,.58);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e9e9ec;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      color: var(--text);
    }
    .phone {
      width: 393px;
      height: 852px;
      position: relative;
      overflow: hidden;
      border-radius: 46px;
      background: #0c0c0e;
      box-shadow: 0 24px 80px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.14);
    }
    .camera {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.64), rgba(0,0,0,.18) 24%, rgba(0,0,0,.18) 66%, rgba(0,0,0,.54)),
        radial-gradient(circle at 70% 42%, rgba(242,205,55,.18), transparent 23%),
        linear-gradient(125deg, #362719 0 34%, #cbbd9f 35% 49%, #75a9ba 50% 58%, #17191e 59% 100%);
    }
    .status { position: absolute; top: 21px; left: 34px; right: 28px; display: flex; justify-content: space-between; color: white; font-weight: 800; font-size: 16px; }
    .header {
      position: absolute; top: 76px; left: 22px; right: 22px; height: 64px; display: flex; align-items: center; justify-content: space-between;
    }
    .menu { width: 36px; height: 36px; border: 1px solid rgba(242,205,55,.55); border-radius: 12px; display:grid; place-items:center; color: var(--yellow); font-weight:900; }
    .brand { margin-left: 12px; margin-right: auto; line-height: 1.04; color: rgba(0,0,0,.72); }
    .brand strong { display:block; font-size: 21px; font-weight: 950; letter-spacing: 0; }
    .brand span { display:block; font-size: 12px; font-weight: 800; color: rgba(255,255,255,.52); margin-top: 5px; }
    .account { border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 12px 16px; font-weight: 900; color: rgba(0,0,0,.68); background: rgba(255,255,255,.06); }
    .mode { position:absolute; top: 205px; left: 43px; width: 152px; height: 40px; border: 1px solid rgba(242,205,55,.5); border-radius: 999px; background: rgba(12,12,14,.72); display:flex; padding:4px; color:white; font-size:11px; font-weight:900; }
    .mode div { flex:1; display:grid; place-items:center; border-radius:999px; color: rgba(255,255,255,.65); }
    .mode .active { background: var(--yellow); color: #111; }
    .frame { position:absolute; left:43px; right:43px; top:260px; height:392px; background: rgba(255,255,255,.16); border-radius: 12px; }
    .corner { position:absolute; width: 32px; height: 32px; border-color: rgba(242,205,55,.72); }
    .tl { top:0; left:0; border-left:3px solid; border-top:3px solid; border-top-left-radius:12px; }
    .tr { top:0; right:0; border-right:3px solid; border-top:3px solid; border-top-right-radius:12px; }
    .bl { bottom:0; left:0; border-left:3px solid; border-bottom:3px solid; border-bottom-left-radius:12px; }
    .br { bottom:0; right:0; border-right:3px solid; border-bottom:3px solid; border-bottom-right-radius:12px; }
    .target-band {
      position:absolute; left: 0; right:0; bottom: 96px; height: 122px;
      background: repeating-linear-gradient(120deg, rgba(125,216,90,.28) 0 3px, transparent 3px 52px);
      border-top: 1px dashed rgba(125,216,90,.55);
      border-bottom: 1px dashed rgba(125,216,90,.55);
      pointer-events:none;
    }
    .controls {
      position:absolute; left: 28px; right: 28px; bottom: 125px; height: 84px;
      display:grid; grid-template-columns: 1fr 94px 1fr; align-items:end; gap:16px;
    }
    .side-btn { height: 62px; border-radius: 16px; border: 1px solid rgba(255,255,255,.25); background: rgba(14,14,16,.46); backdrop-filter: blur(16px); display:flex; align-items:center; justify-content:center; gap:9px; color:white; box-shadow: 0 12px 26px rgba(0,0,0,.18); }
    .side-btn .icon { width:25px; height:25px; border:2px solid white; border-radius:7px; opacity:.88; }
    .side-btn strong { display:block; font-size:15px; line-height:1.05; font-weight:950; }
    .side-btn span { display:block; font-size:11px; color: rgba(255,255,255,.68); font-weight:800; margin-top:3px; }
    .capture { height: 86px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; color:white; font-size:14px; font-weight:950; gap:6px; white-space:nowrap; }
    .shutter { width:58px; height:58px; border-radius:50%; background:#f7f3e9; border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 22px rgba(0,0,0,.22); display:grid; place-items:center; }
    .dot { width:13px; height:13px; border-radius:50%; background:#4d4d4f; }
    .tabbar {
      position:absolute; left: 14px; right: 14px; bottom: 12px; height: 74px;
      border-radius: 28px;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(255,255,255,.62);
      backdrop-filter: blur(26px) saturate(1.2);
      box-shadow: 0 -10px 36px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.55);
      display:grid; grid-template-columns: repeat(3,1fr); padding: 9px 14px 8px;
    }
    .tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color: #8b8d95; font-size:11px; font-weight:900; }
    .tab .glyph { width:25px; height:25px; border-radius:8px; background: currentColor; opacity:.7; mask-size:contain; mask-position:center; mask-repeat:no-repeat; -webkit-mask-size:contain; -webkit-mask-position:center; -webkit-mask-repeat:no-repeat; }
    .tab.active { color:#111; }
    .tab.active .glyph { background: var(--yellow); opacity:1; }
    .home { position:absolute; left:129px; right:129px; bottom:5px; height:5px; border-radius:99px; background:#111; opacity:.9; }
    .note { position:absolute; top: 12px; left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.62); font-weight:700; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="camera"></div>
    <div class="status"><span>2:36</span><span>SOS  Wifi  Battery</span></div>
    <div class="header"><div class="menu">=</div><div class="brand"><strong>BrickVal</strong><span>Live set valuation</span></div><div class="account">Account</div></div>
    <div class="mode"><div>Set</div><div class="active">Minifigs & Parts</div></div>
    <div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
    <div class="target-band"></div>
    <div class="controls">
      <div class="side-btn"><div class="icon"></div><div><strong>Use<br/>photo</strong><span>From library</span></div></div>
      <div class="capture"><div class="shutter"><div class="dot"></div></div><div>Tap to scan</div></div>
      <div class="side-btn"><div><strong>Light</strong><span>off</span></div></div>
    </div>
    <div class="tabbar">
      <div class="tab"><div class="glyph"></div><div>Collection</div></div>
      <div class="tab active"><div class="glyph"></div><div>Scan</div></div>
      <div class="tab"><div class="glyph"></div><div>Settings</div></div>
    </div>
    <div class="home"></div>
  </div>
</body>
</html>
